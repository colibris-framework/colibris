[tox]
#envlist = py36,py37,py38,py39,py311
envlist = py311

[testenv]
changedir = tests
deps = pytest
       requests
commands = pytest {posargs}

[testenv:lint]
changedir = tests
deps = ruff
commands = ruff check colibris {posargs}


[pytest]
testpaths = tests
addopts = -v -p aiohttp.pytest_plugin
